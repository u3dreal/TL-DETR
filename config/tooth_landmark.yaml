GENERAL:
  experiment: tooth_landmark
  seed: 0

DATA:
  # data path (macOS; original Windows paths were F:/dataset/3DTeethLand/...)
  split_root: /Volumes/TOSHIBA_EXT/AUTO-BOLTON/data/3DTeethLand/Split_exp
  # All 16 teeth per arch (3 203 patches). A superset of the 12 anterior teeth, so this
  # tree serves Bolton, tip/torque for every tooth, and the cusp head in one model.
  # `patches` (anterior only, 1 421) is kept as the smaller alternative.
  patch_root: /Volumes/TOSHIBA_EXT/AUTO-BOLTON/data/3DTeethLand/patches_all
  # sample
  # 5000, the paper's / TL-DETR's original setting. Measured on this machine at 5000:
  # 2.16 GB peak MPS driver, 0.57 GB RSS, 6.18 M params - it fits in 8 GB unified memory.
  # The kNN is O(N^2) in memory (5000 -> ~100 MB/call, 2048 -> ~17 MB).
  # NOTE: the model's cprob_out Conv1d has in_channels == num_points, so this value is
  # baked into the weights - changing it requires a fresh training run.
  num_points: 5000
  # augmentation
  augmentation: True
  # landmark
  landmark_std: 0.5

STRUCTURE:
  k: 20
  input_channels: 15
  query_num: 50
  n_edgeconvs_backbone: 5
  emb_dims: 1024
  global_pool_backbone: avg  # max or avg
  norm: instance
  dynamic: False
  dropout: 0.

TRAIN:
  # 50, the paper's value. The old runs bottomed out at epoch 21-23 of 30, but that was under
  # the OLD one-cusp supervision, so it says nothing about when a 4-5 cusp head converges -
  # and a 50-epoch run keeps its own epoch-25 checkpoint (save_top_k=5), while a 30-epoch run
  # cannot produce an epoch-40 one. Cost is idle overnight time (~23 h at 5000 points).
  # OneCycleLR is built from this value, so it must match the number of epochs actually run
  # (`epochs=args.max_epochs` in pl_model.configure_optimizers): 50 here means a real
  # 50-epoch anneal, not 30-with-a-flag.
  max_epochs: 50
  weight_decay: 0.0001
  # batch_size per gpu
  batch_size: 1
  load_from_checkpoint:
  resume_from_checkpoint:

  # one cycle lr scheduler
  lr_max: 0.0001 #0.001
  pct_start: 0.1    # percentage of the cycle spent increasing lr
  div_factor: 25    # determine the initial lr (lr_max / div_factor)
  final_div_factor: 1e4 #1e4   # determine the final lr (lr_max / final_div_factor)
  start_epoch: 0

  train_file: train.txt
  # 0 workers: with the pressure-cached feature matrices a step is ~0.5-9 ms of data work
  # against ~120 ms of model, so worker processes only add IPC and spawn cost (measured:
  # 1.6 s/step with workers vs ~120 ms without, FINDINGS.md section 6).
  train_workers: 0

  val_file: val.txt
  val_workers: 0

  test_file: test.txt
  test_workers: 2

  debug: False
